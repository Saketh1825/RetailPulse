[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S608"]   # we build SQL strings only from validated constants, see docs/NL_SQL_SECURITY.md

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]
"scripts/*" = ["S101"]
